# Concrete products for the one-click Amazon carts on the shopping list.
#
# Each product covers one or more catalog parts (parts/catalog.yaml). The build collects the parts a set of
# projects needs, picks the products that cover them and builds a plain Amazon "add to cart" link:
#   https://www.amazon.de/gp/aws/cart/add.html?ASIN.1=...&Quantity.1=1&ASIN.2=...
# No affiliate tag, no prices. Products were chosen for low price and good reviews and checked on the date below.
# Listings change - re-check them now and then in a browser (Amazon blocks scripted checks) and update `checked`.
#
# group: parts | tools | microbit   (separate cart buttons)
# amazon: de = amazon.de (German pages), com = amazon.com (English pages)

checked: 2026-10-04

