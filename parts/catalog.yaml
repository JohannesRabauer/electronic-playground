# Shared catalog of everything projects use. Projects reference these ids in `parts`.
# Schema: parts/catalog.schema.json
#
# category: component | board | material | tool  (decides the table it is listed in)
# kind:     how it is drawn on the perfboard (see scripts/lib/board.mjs)
# icon:     emoji for things that are not drawn
# name/hint: German and English. `hint` helps parents buy the right thing.

# ---------------------------------------------------------------- components

resistor:
  category: component
  kind: resistor
  name: { de: Widerstand, en: Resistor }
  hint: { de: "Kohleschicht, 1/4 Watt. Die Farbringe zeigen den Wert.", en: "Carbon film, 1/4 watt. The colour bands show the value." }

led-5mm:
  category: component
  kind: led
  name: { de: LED 5 mm, en: LED 5 mm }
  hint: { de: "Das lange Bein ist Plus (+).", en: "The long leg is plus (+)." }

ldr:
  category: component
  kind: ldr
  name: { de: Fotowiderstand (LDR), en: Light-dependent resistor (LDR) }
  hint: { de: "Z. B. GL5528 (5 mm). Die Richtung ist egal.", en: "E.g. GL5528 (5 mm). Direction does not matter." }

transistor-bc547:
  category: component
  kind: transistor
  name: { de: Transistor BC547, en: Transistor BC547 }
  hint: { de: "NPN. Flache Seite zu dir, Beinchen nach unten: C – B – E.", en: "NPN. Flat side towards you, legs down: C – B – E." }

transistor-bc337:
  category: component
  kind: transistor
  name: { de: Transistor BC337, en: Transistor BC337 }
  hint: { de: "NPN, verträgt mehr Strom. Flache Seite zu dir, Beinchen nach unten: C – B – E.", en: "NPN, handles more current. Flat side towards you, legs down: C – B – E." }

elko:
  category: component
  kind: elko
  name: { de: Elektrolytkondensator (Elko), en: Electrolytic capacitor }
  hint: { de: "Mindestens 16 V. Der helle Streifen mit „−“ zeigt das Minus-Bein (das kürzere).", en: "At least 16 V. The light stripe with \"−\" marks the minus leg (the shorter one)." }

cap-ceramic:
  category: component
  kind: cap
  name: { de: Keramikkondensator, en: Ceramic capacitor }
  hint: { de: "Aufdruck 104 = 100 nF. Die Richtung ist egal.", en: "Marked 104 = 100 nF. Direction does not matter." }

buzzer-active:
  category: component
  kind: buzzer
  name: { de: Aktiver Summer, en: Active buzzer }
  hint: { de: "\"Aktiv\" für 3–24 V kaufen, 12 mm Durchmesser, Rastermaß 7,6 mm. Ein passiver Summer bleibt stumm!", en: "Buy an \"active\" one for 3–24 V, 12 mm diameter, 7.6 mm pin spacing. A passive buzzer stays silent!" }

buzzer-passive:
  category: component
  kind: buzzer
  name: { de: Passiver Summer (Piezo), en: Passive buzzer (piezo) }
  hint: { de: "\"Passiv\" kaufen, 12 mm, Rastermaß 7,6 mm – er spielt jeden Ton, den die Schaltung vorgibt.", en: "Buy a \"passive\" one, 12 mm, 7.6 mm pin spacing – it plays whatever tone the circuit makes." }

push-button:
  category: component
  kind: button
  name: { de: Taster 6 × 6 mm, en: Push button 6 × 6 mm }
  hint: { de: "Hat 4 Beinchen – wir brauchen nur zwei schräg gegenüberliegende.", en: "Has 4 legs – we only need two diagonally opposite ones." }

terminal-2:
  category: component
  kind: terminal
  name: { de: Schraubklemme 2-polig, en: 2-pin screw terminal }
  hint: { de: "Rastermaß 5,08 mm (passt auf Lochraster).", en: "5.08 mm pitch (fits perfboard)." }

ic-555:
  category: component
  kind: dip8
  chip: NE555
  name: { de: Timer-IC NE555 + 8-poliger IC-Sockel, en: NE555 timer IC + 8-pin IC socket }
  hint: { de: "Gelötet wird nur der Sockel – der Chip wird am Ende eingesteckt.", en: "Only the socket is soldered – the chip is plugged in at the end." }

ic-4017:
  category: component
  kind: dip16
  chip: CD4017
  name: { de: Zähler-IC CD4017 + 16-poliger IC-Sockel, en: CD4017 counter IC + 16-pin IC socket }
  hint: { de: "Gelötet wird nur der Sockel – der Chip wird am Ende eingesteckt.", en: "Only the socket is soldered – the chip is plugged in at the end." }

toroid:
  category: component
  kind: toroid
  name: { de: Ferrit-Ringkern, en: Ferrite toroid }
  hint: { de: "Ca. 10 mm Außendurchmesser. Alte Energiesparlampen und Netzteile haben oft einen.", en: "About 10 mm outer diameter. Old energy-saving bulbs and power supplies often contain one." }

jumper-wire:
  category: component
  kind: jumper
  name: { de: Drahtbrücke (isolierter Draht), en: Jumper wire (insulated) }
  hint: { de: "Starrer Klingeldraht ist ideal.", en: "Solid-core hook-up wire is ideal." }

battery-clip-9v:
  category: component
  kind: leads
  leads: { pins: ["+", "-"], colors: ["#d32f2f", "#222"], tag: "9V", labels: { de: ["+ rot", "− schwarz"], en: ["+ red", "− black"] } }
  name: { de: 9-V-Batterieclip, en: 9 V battery clip }
  hint: { de: "Mit roter und schwarzer Litze.", en: "With red and black leads." }

battery-holder-aa:
  category: component
  kind: leads
  leads: { pins: ["+", "-"], colors: ["#d32f2f", "#222"], tag: "AA", labels: { de: ["+ rot", "− schwarz"], en: ["+ red", "− black"] } }
  name: { de: Batteriehalter für 1 × AA, en: Battery holder for 1 × AA }
  hint: { de: "Mit Kabeln.", en: "With wires." }

probe-wires:
  category: component
  kind: leads
  leads: { pins: ["1", "2"], colors: ["#1e88e5", "#43a047"], tag: "🌱", labels: { de: ["Fühler 1", "Fühler 2"], en: ["Probe 1", "Probe 2"] } }
  name: { de: Zwei Fühler (Litze + Nagel), en: Two probes (wire + nail) }
  hint: { de: "Je 30 cm Litze, am Ende an einen verzinkten Nagel gelötet oder gewickelt.", en: "30 cm of wire each, soldered or wrapped to a galvanised nail at the end." }

battery-9v:
  category: component
  icon: "🔋"
  name: { de: 9-V-Blockbatterie, en: 9 V battery }
  hint: { de: "Oder ein 9-V-Akku.", en: "Or a rechargeable 9 V battery." }

battery-aa-empty:
  category: component
  icon: "🪫"
  name: { de: „Leere“ AA-Batterie, en: '"Empty" AA battery' }
  hint: { de: "Eine, die im Spielzeug nicht mehr geht – noch ca. 1 V.", en: "One that no longer works in a toy – still about 1 V." }

perfboard:
  category: board
  icon: "🟫"
  name: { de: Lochrasterplatine, en: Perfboard }
  hint: { de: "Rastermaß 2,54 mm, mit einzelnen Lötpunkten (keine Streifen). Große Platinen kann man mit dem Cutter anritzen und brechen.", en: "2.54 mm pitch, with separate pads (not stripboard). Score big boards with a craft knife and snap them." }

# ---------------------------------------------------------------- micro:bit

microbit-v2:
  category: component
  icon: "🧩"
  name: { de: BBC micro:bit V2, en: BBC micro:bit V2 }
  hint: { de: "Auf der Rückseite steht „V2“ – nur V2 hat Lautsprecher, Mikrofon und Touch-Logo. Am günstigsten im „Go“-Set mit Kabel und Batteriehalter.", en: "It says \"V2\" on the back – only V2 has the speaker, microphone and touch logo. Cheapest in the \"Go\" bundle with cable and battery holder." }

usb-cable-micro:
  category: component
  icon: "🔌"
  name: { de: USB-Kabel (Micro-USB), en: USB cable (micro USB) }
  hint: { de: "Ein Datenkabel – reine Ladekabel funktionieren nicht.", en: "A data cable – charge-only cables do not work." }

battery-pack-aaa:
  category: component
  icon: "🔋"
  name: { de: "Batteriehalter 2 × AAA mit Stecker", en: "Battery holder 2 × AAA with plug" }
  hint: { de: "Mit JST-Stecker für den micro:bit, plus zwei AAA-Batterien.", en: "With a JST plug for the micro:bit, plus two AAA batteries." }

crocodile-clips:
  category: component
  icon: "🐊"
  name: { de: Krokodilklemmen-Kabel, en: Crocodile clip leads }
  hint: { de: "Kurze Kabel mit Klemmen an beiden Enden – passen an die großen Ringe des micro:bit.", en: "Short leads with clips at both ends – they fit the big rings of the micro:bit." }

clip-leads-course:
  category: component
  kind: leads
  leads: { pins: ["P1", "GND"], colors: ["#fbc02d", "#222"], tag: "µ:bit", labels: { de: ["→ P1 gelb", "→ GND schwarz"], en: ["→ P1 yellow", "→ GND black"] } }
  name: { de: "2 Krokodilklemmen-Kabel (gelb, schwarz)", en: "2 crocodile clip leads (yellow, black)" }
  hint: { de: "Eine Klemme abschneiden, abisolieren und einlöten – die andere kommt an den micro:bit.", en: "Cut off one clip, strip the wire and solder it in – the other clip goes on the micro:bit." }

clip-leads-pads:
  category: component
  kind: leads
  leads: { pins: ["P0", "P2"], colors: ["#43a047", "#1e88e5"], tag: "µ:bit", labels: { de: ["→ P0 grün", "→ P2 blau"], en: ["→ P0 green", "→ P2 blue"] } }
  name: { de: "2 Krokodilklemmen-Kabel (grün, blau)", en: "2 crocodile clip leads (green, blue)" }
  hint: { de: "Eine Klemme abschneiden, abisolieren und einlöten – die andere kommt an den micro:bit.", en: "Cut off one clip, strip the wire and solder it in – the other clip goes on the micro:bit." }

# ---------------------------------------------------------------- materials

copper-wire-bare:
  category: material
  icon: "〰️"
  name: { de: "Blanker Kupferdraht 1,5 mm", en: Bare copper wire 1.5 mm }
  hint: { de: "Z. B. aus einem Stück NYM-Installationskabel 1,5 mm² (Mantel und Isolierung entfernen). Kein Lackdraht!", en: "E.g. from a piece of solid house wiring, 1.5 mm² / 14 AWG (strip all insulation). No enamelled wire!" }

enamelled-wire:
  category: material
  icon: "🧶"
  name: { de: "Kupferlackdraht 0,3 mm, zwei Farben", en: "Enamelled copper wire 0.3 mm, two colours" }
  hint: { de: "Je ca. 50 cm. Die Enden mit Schleifpapier blank machen.", en: "About 50 cm each. Sand the ends bare." }

stranded-wire:
  category: material
  icon: "🧵"
  name: { de: Flexible Litze, en: Stranded wire }
  hint: { de: "Isoliert, ca. 0,25 mm².", en: "Insulated, about 0.25 mm² / 24 AWG." }

nails:
  category: material
  icon: "📌"
  name: { de: Verzinkte Nägel, en: Galvanised nails }
  hint: { de: "Ca. 5 cm lang – sie rosten nicht so schnell in feuchter Erde.", en: "About 5 cm long – they rust less in damp soil." }

wood-board:
  category: material
  icon: "🪵"
  name: { de: Holzbrett, en: Wooden board }
  hint: { de: "Ein Reststück reicht.", en: "Any offcut will do." }

insulating-tape:
  category: material
  icon: "🩹"
  name: { de: Isolierband, en: Insulating tape }
  hint: { de: "Bunt macht mehr Spaß.", en: "Colourful is more fun." }

wooden-dowel:
  category: material
  icon: "🥢"
  name: { de: Rundholz oder leerer Stift, en: Wooden dowel or empty pen }
  hint: { de: "Als Griff, ca. 10 cm lang.", en: "For the handle, about 10 cm long." }

sandpaper:
  category: material
  icon: "🟨"
  name: { de: Schleifpapier, en: Sandpaper }
  hint: { de: "Fein (Körnung 240 oder feiner).", en: "Fine (240 grit or finer)." }

lanyard:
  category: material
  icon: "🪢"
  name: { de: Schnur oder Schlüsselband, en: String or lanyard }
  hint: { de: "Zum Umhängen – durch die Löcher am Rand des micro:bit fädeln.", en: "To wear it – thread it through the holes on the edge of the micro:bit." }

craft-box:
  category: material
  icon: "📦"
  name: { de: Bastelmaterial für ein Gehäuse, en: Craft material for a case }
  hint: { de: "Karton, Marmeladenglas, Joghurtbecher – was da ist.", en: "Cardboard, a jam jar, a yoghurt pot – whatever you have." }

# ---------------------------------------------------------------- tools

computer:
  category: tool
  icon: "💻"
  name: { de: Computer oder Tablet mit Internet, en: Computer or tablet with internet }
  hint: { de: "Für den Editor MakeCode im Browser – nichts zu installieren.", en: "For the MakeCode editor in the browser – nothing to install." }

soldering-iron:
  category: tool
  icon: "🔥"
  name: { de: Lötkolben mit Ablage, en: Soldering iron with stand }
  hint: { de: "Mit Temperaturregelung, ca. 350 °C.", en: "Temperature controlled, about 350 °C." }

solder:
  category: tool
  icon: "🧪"
  name: { de: Lötzinn bleifrei, en: Lead-free solder }
  hint: { de: "Mit Flussmittelseele, 0,8–1 mm.", en: "Flux core, 0.8–1 mm." }

side-cutter:
  category: tool
  icon: "✂️"
  name: { de: Seitenschneider, en: Side cutters }

pliers:
  category: tool
  icon: "🔧"
  name: { de: Flachzange, en: Flat-nose pliers }

wire-stripper:
  category: tool
  icon: "🪢"
  name: { de: Abisolierzange, en: Wire stripper }

screwdriver:
  category: tool
  icon: "🪛"
  name: { de: Kleiner Schlitzschraubendreher, en: Small flat screwdriver }

safety-glasses:
  category: tool
  icon: "🥽"
  name: { de: Schutzbrille, en: Safety glasses }

drill:
  category: tool
  icon: "🛠️"
  name: { de: Bohrmaschine (für Eltern), en: Drill (for parents) }
