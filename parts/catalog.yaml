# Shared catalog of everything projects use. Projects reference these ids in `parts`.
# Schema: parts/catalog.schema.json
#
# category: component | board | material | tool  (decides the table it is listed in)
# kind:     how it is drawn on the perfboard (see scripts/lib/board.mjs)
# icon:     emoji for things that are not drawn
# name/hint: German and English. `hint` helps parents buy the right thing.

# ---------------------------------------------------------------- components

resistor:
  category: component
  kind: resistor
  name: { de: Widerstand, en: Resistor }
  hint: { de: "Kohleschicht, 1/4 Watt. Die Farbringe zeigen den Wert.", en: "Carbon film, 1/4 watt. The colour bands show the value." }
  buy: { search: { de: "Widerstand Sortiment 1/4W", en: "resistor assortment 1/4W" }, shops: [reichelt, aliexpress, amazon], tip: { de: "Am günstigsten als Sortiment (E12, ca. 600 Stück). Die E24-Werte der Mini-Orgel (24k, 20k, 16k) gibt es einzeln bei Reichelt für wenige Cent.", en: "Cheapest as an assortment (E12, about 600 pieces). The E24 values of the Mini Organ (24k, 20k, 16k) cost a few cents each at single-part shops." } }

