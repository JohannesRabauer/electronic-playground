# Concrete Pollin articles for the one-click Pollin carts on the German pages (pollin.de ships to DE/AT/…).
#
# One click posts all articles of a cart to Pollin's own "add to cart" endpoint
# (https://www.pollin.de/checkout/line-item/add) and then opens the Pollin cart. No account and no partner programme.
# This is not an official Pollin interface - if Pollin changes its shop, the buttons stop working. Re-check now and then.
#
# id:     the article's cart id: the 32-character hex code in "lineItems[<id>]" of the buy form on the product page
#         (or run the scratchpad helper: search pollin.de and read the form)
# covers: catalog parts (parts/catalog.yaml) this article is for
# pack:   pieces per article. The cart quantity is "needed pieces ÷ pack", rounded up.
#         Without pack the article goes into the cart once (assortments, wire, tools).
#         For parts with a length or size instead of a number (perfboard, wire), each project counts as one piece.
# values: only for these values (e.g. resistances); E12 = the whole E12 series. Missing values are listed below the button.
# note:   short hint shown in the list of cart contents
# group:  parts | tools

