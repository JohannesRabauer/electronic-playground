    - { ref: LED2, pins: { A: M7, K: M8 } }
    - { ref: Q1, pins: { C: D8, B: D9, E: D10 } }
    - { ref: Q2, pins: { C: K8, B: K9, E: K10 } }
    - { ref: C1, pins: { "+": E7, "-": G7 } }
    - { ref: C2, pins: { "+": J8, "-": H8 } }
