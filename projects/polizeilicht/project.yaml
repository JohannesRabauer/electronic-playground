# yaml-language-server: $schema=../project.schema.json
id: polizeilicht
number: 4
status: published
slug: { de: polizei-blinklicht, en: police-flasher }

title:
  de: Polizei-Blinklicht
  en: Police Flasher

tagline:
  de: Rot und Blau blinken im Wechsel – perfekt für ein Polizeiauto aus Karton.
  en: Red and blue flash in turn – perfect for a cardboard police car.

facts:
  age: 9
  difficulty: 2
  minutes: 120
  cost_eur: 7
  topics: [light]

learn:
  de:
    - Wie Kondensatoren Strom speichern und wieder abgeben
    - Wie zwei Transistoren sich gegenseitig an- und ausschalten
    - Auf die Richtung von Elkos achten
  en:
    - How capacitors store electricity and give it back
    - How two transistors switch each other on and off
    - Watching the direction of electrolytic capacitors

hero: images/police.svg

intro:
  de: |
    Tatü-tata! Diese Schaltung lässt eine rote und eine blaue LED **abwechselnd blinken** – ganz ohne Computer oder Chip.
    Das schaffen zwei Transistoren und zwei Kondensatoren, die sich wie auf einer Wippe gegenseitig hin- und herschubsen.

    Bastle ein Polizeiauto aus einem Karton und setz die LEDs aufs Dach!
  en: |
    Nee-naw! This circuit makes a red and a blue LED **flash alternately** – without any computer or chip.
    Two transistors and two capacitors do it, pushing each other back and forth like on a seesaw.

    Build a police car from a cardboard box and put the LEDs on the roof!

simulation:
  circuit: circuit.txt
  try:
    de: |
      Schau zu, wie die LEDs im Wechsel blinken. Beobachte die gelben Punkte an den Kondensatoren C1 und C2.
      **Doppelklick auf C1** und ändere den Wert von 10 µF auf 22 µF: Was passiert mit dem Blinken?
    en: |
      Watch the LEDs flash in turn. Look at the yellow dots at the capacitors C1 and C2.
      **Double-click C1** and change the value from 10 µF to 22 µF: what happens to the flashing?

