title:
  de: Mini-Orgel
  en: Mini Organ

tagline:
  de: Sechs Tasten, sechs Töne – genug für „Alle meine Entchen“.
  en: Six keys, six notes – enough for your first tunes.

facts:
  age: 10
  difficulty: 2
  minutes: 150
  cost_eur: 9
  topics: [sound]

learn:
  de:
    - Wie ein Chip (IC) eingebaut wird – mit Sockel und Kerbe
    - Dass ein Ton ein ganz schnelles Ein und Aus ist
    - Wie ein Widerstand die Tonhöhe bestimmt
  en:
    - How a chip (IC) is fitted – with a socket and a notch
    - That a sound is a very fast on and off
    - How a resistor sets the pitch

hero: images/organ.svg

intro:
  de: |
    Das Herz dieser Orgel ist ein kleiner Chip, der **NE555**. Er schaltet einen Piezo-Summer hunderte Male pro Sekunde
    ein und aus – das hörst du als Ton. Wie schnell er das tut, bestimmt der Widerstand an der Taste, die du drückst.

    Sechs Tasten ergeben die Töne **C D E F G A**. Damit kannst du schon „Alle meine Entchen“ spielen!
  en: |
    The heart of this organ is a small chip, the **NE555**. It switches a piezo buzzer on and off hundreds of times a
    second – you hear that as a note. How fast it does that is set by the resistor on the key you press.

    Six keys give the notes **C D E F G A** – enough for simple tunes like "Mary Had a Little Lamb" (E D C D E E E).

simulation:
  circuit: circuit.txt
  try:
    de: |
      Die Tasten sind im Simulator Schalter: **Klick eine Taste an** (z. B. „C“), dann klick rechts auf **„▶ Audio abspielen“**.
      Klick die Taste wieder an, um sie auszuschalten, und probier eine andere. Welche Taste klingt am höchsten?
    en: |
      In the simulator the keys are switches: **click a key on** (e.g. "C"), then click **"▶ Play Audio"** on the right.
      Click the key again to switch it off and try another one. Which key sounds highest?

