# yaml-language-server: $schema=../project.schema.json
id: heisser-draht
number: 1
status: published
category: solder
slug: { de: heisser-draht, en: buzz-wire }

title:
  de: Heißer Draht
  en: Buzz Wire Game

tagline:
  de: Führe die Öse am Draht entlang – wenn du ihn berührst, piept es und die LED leuchtet!
  en: Guide the loop along the wire – touch it and it beeps and the LED lights up!

facts:
  age: 8
  difficulty: 1
  minutes: 90
  cost_eur: 8
  topics: [game, sound, light]

learn:
  de:
    - Was ein geschlossener Stromkreis ist
    - Warum eine LED einen Vorwiderstand braucht
    - Löten auf Lochraster und Lötbrücken ziehen
  en:
    - What a closed circuit is
    - Why an LED needs a series resistor
    - Soldering on perfboard and making solder bridges

hero: images/game.svg

intro:
  de: |
    Der **heiße Draht** ist ein Geschicklichkeitsspiel: Du führst eine kleine Drahtöse an einem
    gebogenen Draht entlang, ohne ihn zu berühren. Schaffst du es von Start bis Ziel, ohne dass es piept?

    Das Spiel ist der perfekte Einstieg ins Löten: nur **vier Bauteile**, und am Ende hast du etwas,
    mit dem du deine ganze Familie herausfordern kannst.
  en: |
    The **buzz wire game** is a test of skill: you guide a small wire loop along a bent wire without
    touching it. Can you get from start to finish without a beep?

    It is the perfect first soldering project: only **four parts**, and at the end you have a game
    to challenge your whole family with.

simulation:
  circuit: circuit.txt
  try:
    de: |
      **Halte die Maus gedrückt** auf dem Taster „Draht berühren“ – so, als würde die Öse den Draht berühren.
      Was passiert mit der LED und dem Summer? Lass los: Fließt jetzt noch Strom?

      *Tipp:* Die gelben Punkte zeigen, wie der Strom fließt.
    en: |
      **Press and hold the mouse** on the button "Touch the wire" – just like the loop touching the wire.
      What happens to the LED and the buzzer? Let go: is current still flowing?

      *Tip:* The yellow dots show how the current flows.

parts:
  - { ref: R1, part: resistor, qty: 1, value: 470, note: { de: "Farbringe: gelb – violett – braun – gold", en: "Colour bands: yellow – violet – brown – gold" } }
  - { ref: LED1, part: led-5mm, qty: 1, color: "#e53935", note: { de: rot, en: red } }
  - { ref: BZ1, part: buzzer-active, qty: 1 }
  - { ref: X1, part: terminal-2, qty: 1, note: { de: "Hier kommen Spieldraht und Griff dran.", en: "The game wire and the handle connect here." } }
  - { ref: BAT, part: battery-clip-9v, qty: 1 }
  - { part: battery-9v, qty: 1 }
  - { part: perfboard, qty: "12 × 11", note: { de: "Löcher (ca. 3 × 3 cm)", en: "holes (about 3 × 3 cm)" } }
  - { part: copper-wire-bare, qty: "60 cm" }
  - { part: stranded-wire, qty: "50 cm" }
  - { part: wood-board, qty: "40 × 10 cm" }
  - { part: wooden-dowel, qty: 1 }
  - { part: insulating-tape, qty: 1 }
  - { part: soldering-iron, qty: 1 }
  - { part: solder, qty: 1 }
  - { part: side-cutter, qty: 1 }
  - { part: pliers, qty: 1 }
  - { part: screwdriver, qty: 1 }
  - { part: safety-glasses, qty: 1 }
  - { part: drill, qty: 1 }

board:
  cols: 12
  rows: 11
  parts:
    - { ref: X1, pins: { "1": B2, "2": B4 }, opens: left }
    - { ref: R1, pins: { "1": E4, "2": E8 }, label: left }
    - { ref: LED1, pins: { A: E10, K: F10 } }
    - { ref: BZ1, pins: { "+": H4, "-": H7 } }
    - { ref: BAT, pins: { "+": K2, "-": K10 } }
  bridges:
    - { id: touch, points: [B4, E4, H4] }
    - { id: led, points: [E8, E10] }
    - { id: plus, points: [B2, K2] }
    - { id: minus-buzzer, points: [H7, H10] }
    - { id: minus, points: [F10, H10, K10] }

nets:
  PLUS: [BAT.+, X1.1]
  TOUCH: [X1.2, R1.1, BZ1.+]
  LED: [R1.2, LED1.A]
  MINUS: [LED1.K, BZ1.-, BAT.-]

steps:
  - id: prepare
    view: top
    marks: [A1]
    title: { de: Platine vorbereiten, en: Prepare the board }
    text:
      de: |
        Lege die Platine so vor dich, dass die **Kupferpunkte nach unten** zeigen. Markiere mit einem Stift
        die Ecke oben links als **A1**. Die Buchstaben gehen nach rechts, die Zahlen nach unten –
        wie bei Schiffe versenken!
      en: |
        Place the board in front of you with the **copper pads facing down**. Mark the top-left corner
        as **A1** with a pen. Letters go to the right, numbers go down – just like Battleship!
    parent:
      de: Ist die Platine größer, ritzt ihr sie entlang einer Lochreihe mehrmals mit dem Cutter an und brecht sie über einer Tischkante.
      en: If the board is bigger, score it several times along a row of holes with a craft knife and snap it over a table edge.

  - id: resistor
    view: top
    adds: [R1]
    title: { de: Widerstand R1 einlöten, en: Solder resistor R1 }
    text:
      de: |
        Biege die Beine des Widerstands mit der Zange um, sodass sie in **E4** und **E8** passen.
        Stecke ihn durch, drehe die Platine um und biege die Beine leicht auseinander, damit er nicht herausfällt.
        Löte beide Beine fest und schneide die Reste ab. Beim Widerstand ist die Richtung egal.
      en: |
        Bend the legs of the resistor with the pliers so they fit into **E4** and **E8**.
        Push it through, turn the board over and bend the legs apart a little so it does not fall out.
        Solder both legs and cut off the rest. The direction of a resistor does not matter.
    tip:
      de: "Wirf die abgeschnittenen Beinchen nicht weg! Daraus machst du später die Lötbrücken."
      en: "Do not throw away the cut-off legs! You will use them for the solder bridges later."

  - id: led
    view: top
    adds: [LED1]
    title: { de: LED einlöten, en: Solder the LED }
    text:
      de: |
        Bei der LED ist die Richtung wichtig! Das **lange Bein (+)** kommt in **E10**, das kurze Bein in **F10**.
        Die abgeflachte Seite am Rand der LED zeigt zum kurzen Bein.
      en: |
        For the LED the direction matters! The **long leg (+)** goes into **E10**, the short leg into **F10**.
        The flat side on the rim of the LED points to the short leg.
    warning:
      de: Halte den Lötkolben nicht länger als 3 Sekunden an ein LED-Bein, sonst wird sie zu heiß.
      en: Do not hold the iron on an LED leg for more than 3 seconds, or it gets too hot.

  - id: buzzer
    view: top
    adds: [BZ1]
    title: { de: Summer einlöten, en: Solder the buzzer }
    text:
      de: |
        Auch beim Summer gibt es Plus und Minus: Das Bein mit dem **+** auf dem Gehäuse (meist das längere)
        kommt in **H4**, das andere in **H7**.
      en: |
        The buzzer has plus and minus too: the leg marked **+** on the case (usually the longer one)
        goes into **H4**, the other one into **H7**.
    tip:
      de: Auf neuen Summern klebt oft ein Aufkleber. Ziehst du ihn ab, wird er lauter.
      en: New buzzers often have a sticker on top. Peel it off and it gets louder.

  - id: terminal
    view: top
    adds: [X1]
    title: { de: Schraubklemme einlöten, en: Solder the screw terminal }
    text:
      de: Die Schraubklemme kommt in **B2** und **B4**. Die Öffnungen für die Drähte zeigen **nach außen** (nach links).
      en: The screw terminal goes into **B2** and **B4**. The openings for the wires face **outwards** (to the left).

  - id: bridges-1
    view: bottom
    adds: [touch, led]
    title: { de: Erste Lötbrücken, en: First solder bridges }
    text:
      de: |
        Dreh die Platine um. **Achtung: Jetzt ist alles spiegelverkehrt!** A ist jetzt rechts.
        Lege ein abgeschnittenes Bein von **B4 über E4 bis H4** auf die Lötpunkte und löte es an allen drei Stellen fest.
        Mit einem zweiten Bein verbindest du **E8 mit E10**.
      en: |
        Turn the board over. **Careful: now everything is mirrored!** A is now on the right.
        Lay a cut-off leg from **B4 across E4 to H4** on the pads and solder it at all three points.
        Use a second leg to connect **E8 to E10**.
    tip:
      de: Halte den Draht mit der Zange fest, nicht mit den Fingern – er wird heiß!
      en: Hold the wire with the pliers, not your fingers – it gets hot!

  - id: bridges-2
    view: bottom
    adds: [plus, minus-buzzer, minus]
    title: { de: Restliche Lötbrücken, en: Remaining solder bridges }
    text:
      de: |
        Jetzt noch drei Brücken: **B2 bis K2** (Plus), **H7 bis H10** und **F10 über H10 bis K10** (Minus).
        Prüfe danach genau: Berührt keine Brücke einen Nachbarpunkt, der nicht dazugehört?
      en: |
        Three more bridges: **B2 to K2** (plus), **H7 to H10** and **F10 across H10 to K10** (minus).
        Then check carefully: no bridge may touch a neighbouring pad that does not belong to it.

  - id: battery-clip
    view: top
    adds: [BAT]
    title: { de: Batterieclip anlöten, en: Solder the battery clip }
    text:
      de: |
        Verdrille die Enden der Litzen und verzinne sie (etwas Lötzinn drauf). Das **rote Kabel (+)** kommt in **K2**,
        das **schwarze Kabel (−)** in **K10**. Steck die Batterie noch nicht an!
      en: |
        Twist the ends of the leads and tin them (add a little solder). The **red wire (+)** goes into **K2**,
        the **black wire (−)** into **K10**. Do not connect the battery yet!

  - id: game
    view: none
    image: images/game.svg
    title: { de: Das Spielfeld bauen, en: Build the game }
    text:
      de: |
        1. Bohrt zwei Löcher (1,5 mm) in das Holzbrett, etwa 35 cm auseinander.
        2. Biege den Kupferdraht in lustige Kurven und Wellen.
        3. Mache aus einem kurzen Stück Draht eine **Öse** (Ring, ca. 1,5 cm) und befestige sie am Griff.
        4. **Fädle die Öse auf den Spieldraht – bevor** du beide Enden ins Brett steckst!
        5. Wickle Isolierband um beide Enden des Spieldrahts: Das sind **Start** und **Ziel**, dort darf die Öse ausruhen.
        6. Verbinde ein Ende des Spieldrahts mit **X1 oben (B2)** und die Öse über die Litze mit **X1 unten (B4)**.
      en: |
        1. Drill two holes (1.5 mm) into the wooden board, about 35 cm apart.
        2. Bend the copper wire into fun curves and waves.
        3. Make a **loop** (ring, about 1.5 cm) from a short piece of wire and fix it to the handle.
        4. **Thread the loop onto the game wire – before** you push both ends into the board!
        5. Wrap insulating tape around both ends of the game wire: these are **start** and **finish**, where the loop may rest.
        6. Connect one end of the game wire to **X1 top (B2)** and the loop, via the stranded wire, to **X1 bottom (B4)**.
    parent:
      de: Das Bohren übernehmen am besten die Eltern. Biegt die Drahtenden im Brett unten um, dann hält alles ohne Kleber.
      en: Parents should do the drilling. Bend the wire ends over underneath the board and everything holds without glue.

  - id: test
    view: none
    title: { de: Testen und spielen!, en: Test and play! }
    text:
      de: |
        Steck die 9-V-Batterie an. Berühre mit der Öse den Draht: **Piep!** und die LED leuchtet.
        Jetzt kann es losgehen – wer schafft die Strecke ohne Piepen?
      en: |
        Connect the 9 V battery. Touch the wire with the loop: **beep!** and the LED lights up.
        Now the game is on – who can make it to the finish without a beep?
    tip:
      de: Einen Ein/Aus-Schalter brauchst du nicht – solange sich die Drähte nicht berühren, fließt kein Strom.
      en: You do not need an on/off switch – as long as the wires do not touch, no current flows.

explanation:
  kids:
    de: |
      Strom fließt nur im **Kreis**: von Plus durch die Bauteile zurück zu Minus. Der Spieldraht ist mit Plus
      verbunden, die Öse mit LED und Summer. Solange sich beide nicht berühren, ist der Kreis **offen** – nichts passiert.
      Berührst du den Draht, **schließt** du den Kreis: Strom fließt, der Summer piept und die LED leuchtet.
      Dein heißer Draht ist also ein **Schalter**, den du mit der Hand bedienst!
    en: |
      Current only flows in a **circle**: from plus through the parts and back to minus. The game wire is connected
      to plus, the loop to the LED and the buzzer. As long as they do not touch, the circuit is **open** – nothing happens.
      When you touch the wire, you **close** the circuit: current flows, the buzzer beeps and the LED lights up.
      So your buzz wire is a **switch** that you work by hand!
  parents:
    de: |
      LED und Summer liegen parallel hinter dem „Schalter“ aus Draht und Öse. Die rote LED hat etwa 2 V Flussspannung;
      der Vorwiderstand begrenzt den Strom auf (9 V − 2 V) / 470 Ω ≈ **15 mA**. Ohne ihn würde die LED sofort durchbrennen.
      Der aktive Summer hat einen eingebauten Oszillator und piept bei Gleichspannung von selbst (ca. 10–30 mA).
      Im Ruhezustand fließt kein Strom, die Batterie hält daher sehr lange.
    en: |
      The LED and the buzzer are in parallel behind the "switch" formed by the wire and the loop. A red LED has a forward
      voltage of about 2 V; the series resistor limits the current to (9 V − 2 V) / 470 Ω ≈ **15 mA**. Without it the LED
      would burn out at once. The active buzzer has a built-in oscillator and beeps on DC by itself (about 10–30 mA).
      At rest no current flows, so the battery lasts a very long time.

variations:
  - title: { de: Leise-Modus, en: Quiet mode }
    text:
      de: Baue einen Schalter in die Leitung zum Summer (zwischen H7 und H10). Dann kannst du nachts nur mit Licht spielen.
      en: Add a switch in the buzzer line (between H7 and H10). Then you can play at night with just the light.
    circuit: variation-quiet.txt
  - title: { de: Schwieriger machen, en: Make it harder }
    text:
      de: Mehr Kurven, engere Wellen, eine kleinere Öse – oder spielt mit der „falschen“ Hand!
      en: More bends, tighter waves, a smaller loop – or play with your "wrong" hand!
  - title: { de: Andere Farbe, en: Another colour }
    text:
      de: Probiere eine grüne oder blaue LED. Blaue LEDs brauchen etwa 3 V – leuchtet sie trotzdem hell genug?
      en: Try a green or blue LED. Blue LEDs need about 3 V – is it still bright enough?

troubleshooting:
  - problem: { de: Beim Berühren passiert gar nichts., en: Nothing happens when touching. }
    solution:
      de: Ist die Batterie voll und der Clip fest? Sitzen beide Drähte fest in der Schraubklemme? Ist der Spieldraht blank (kein Lackdraht)? Prüfe alle Lötstellen auf der Unterseite.
      en: Is the battery charged and the clip on tight? Are both wires tight in the screw terminal? Is the game wire bare (not enamelled)? Check all solder joints on the bottom.
  - problem: { de: "Es piept, aber die LED bleibt dunkel.", en: "It beeps but the LED stays dark." }
    solution:
      de: Die LED ist wahrscheinlich falsch herum eingelötet. Das lange Bein muss in E10.
      en: The LED is probably soldered in the wrong way round. The long leg must go into E10.
  - problem: { de: "Die LED leuchtet, aber es piept nicht.", en: "The LED lights up but there is no beep." }
    solution:
      de: Ist der Summer richtig herum (+ in H4)? Ist es wirklich ein **aktiver** Summer? Passive Summer bleiben an Gleichspannung stumm.
      en: Is the buzzer the right way round (+ in H4)? Is it really an **active** buzzer? Passive buzzers stay silent on DC.
  - problem: { de: Es piept die ganze Zeit., en: It beeps all the time. }
    solution:
      de: Irgendwo berühren sich Plus und die Öse – oft eine Lötbrücke, die zwei Punkte zu viel verbindet, oder ein blankes Drahtende am Brett.
      en: Plus and the loop are touching somewhere – often a solder bridge connecting one pad too many, or a bare wire end on the board.

safety:
  de:
    - Die Drahtenden sind spitz – biegt sie um oder klebt Isolierband darüber.
    - Nur mit 9-V-Batterie betreiben, niemals an ein Netzteil aus der Steckdose ohne Erwachsene.
  en:
    - The wire ends are sharp – bend them over or cover them with tape.
    - Only use a 9 V battery; never connect a mains power supply without an adult.
