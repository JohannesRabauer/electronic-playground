<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-label="Buzz wire game">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5252" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff5252" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a066"/>
      <stop offset="1" stop-color="#b57a3e"/>
    </linearGradient>
  </defs>

  <!-- wooden base -->
  <rect x="20" y="214" width="600" height="56" rx="10" fill="url(#wood)" stroke="#8a5a2b" stroke-width="2"/>
  <path d="M40 232 C 160 226, 300 240, 600 230 M40 252 C 200 246, 380 258, 600 250" stroke="#a46b34" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- game wire -->
  <path d="M70 216 L70 150 C 100 70, 150 60, 190 130 S 260 205, 300 115 S 380 40, 420 120 S 500 175, 530 100 L570 150 L570 216"
        fill="none" stroke="#c87533" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- start and finish (tape) -->
  <line x1="70" y1="208" x2="70" y2="166" stroke="#1e88e5" stroke-width="13" stroke-linecap="round"/>
  <line x1="570" y1="208" x2="570" y2="164" stroke="#43a047" stroke-width="13" stroke-linecap="round"/>

  <!-- handle with loop around the wire -->
  <line x1="318" y1="132" x2="372" y2="196" stroke="#8d6e63" stroke-width="14" stroke-linecap="round"/>
  <line x1="306" y1="120" x2="320" y2="134" stroke="#c87533" stroke-width="4"/>
  <ellipse cx="298" cy="112" rx="13" ry="19" transform="rotate(-25 298 112)" fill="none" stroke="#c87533" stroke-width="4"/>
  <!-- cable from handle to electronics -->
  <path d="M372 196 C 380 240, 260 236, 214 208" fill="none" stroke="#fdd835" stroke-width="4" stroke-linecap="round"/>
  <!-- cable from wire start to electronics -->
  <path d="M74 200 C 90 214, 100 210, 112 204" fill="none" stroke="#e53935" stroke-width="4" stroke-linecap="round"/>

  <!-- electronics -->
  <rect x="108" y="180" width="108" height="36" rx="4" fill="#d4b27a" stroke="#8d6b38" stroke-width="2"/>
  <rect x="112" y="186" width="16" height="22" rx="2" fill="#2f80d0"/>
  <circle cx="200" cy="196" r="22" fill="url(#glow)"/>
  <circle cx="200" cy="196" r="8" fill="#e53935" stroke="#7a1b1b" stroke-width="1.5"/>
  <circle cx="160" cy="196" r="13" fill="#262626"/>
  <circle cx="160" cy="196" r="3" fill="#555"/>
  <rect x="228" y="184" width="30" height="32" rx="3" fill="#455a64"/>
  <rect x="236" y="178" width="14" height="7" rx="2" fill="#90a4ae"/>
  <text x="243" y="206" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">9V</text>

  <!-- beep -->
  <g stroke="#ff6d00" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M142 168 q -8 -10 0 -20"/><path d="M134 172 q -14 -16 0 -32"/>
    <path d="M178 168 q 8 -10 0 -20"/><path d="M186 172 q 14 -16 0 -32"/>
  </g>
  <text x="160" y="140" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ff6d00" text-anchor="middle">BEEP!</text>
</svg>
