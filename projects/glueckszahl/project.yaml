# yaml-language-server: $schema=../project.schema.json
id: glueckszahl
number: 7
status: published
slug: { de: glueckszahl-maschine, en: lucky-number-machine }

title:
  de: Glückszahl-Maschine
  en: Lucky Number Machine

tagline:
  de: Halte den Knopf gedrückt, lass los – welche der zehn Zahlen leuchtet?
  en: Hold the button, let go – which of the ten numbers lights up?

facts:
  age: 11
  difficulty: 3
  minutes: 240
  cost_eur: 10
  topics: [game, light]

learn:
  de:
    - Wie ein Chip zählen kann (Dezimalzähler CD4017)
    - Wie ein Takt-Chip (NE555) einen anderen Chip antreibt
    - Große Platinen mit vielen Lötbrücken und Drahtbrücken planen
  en:
    - How a chip can count (CD4017 decade counter)
    - How a clock chip (NE555) drives another chip
    - Building a big board with many solder bridges and jumper wires

hero: images/lucky.svg

intro:
  de: |
    Das ist das **Meisterstück**: zwei Chips, zehn LEDs und über 80 Lötstellen.
    Solange du den Knopf drückst, springt das Licht blitzschnell von Zahl zu Zahl. Lässt du los, bleibt es stehen –
    und keiner kann vorhersagen, wo. Perfekt zum Würfeln, Auslosen oder für eure eigenen Spiele!

    Bau zuerst ein paar einfachere Projekte – vor allem die **Mini-Orgel**, denn der NE555 arbeitet hier genauso.
  en: |
    This is the **masterpiece**: two chips, ten LEDs and more than 80 solder joints.
    While you hold the button, the light jumps from number to number at lightning speed. When you let go, it stops –
    and nobody can predict where. Perfect for rolling dice, drawing lots or your own games!

    Build a few easier projects first – especially the **Mini Organ**, because the NE555 works the same way here.

simulation:
  circuit: circuit.txt
  try:
    de: |
      **Halte die Maus auf dem Taster S1** gedrückt: Die LEDs leuchten der Reihe nach 0, 1, 2, … auf.
      Lass los – welche Zahl bleibt stehen? Schau dir an, wie der NE555 (links) den Zähler (rechts) antreibt.
    en: |
      **Hold the mouse down on push button S1**: the LEDs light up in turn 0, 1, 2, …
      Let go – which number stays on? Look at how the NE555 (left) drives the counter (right).

