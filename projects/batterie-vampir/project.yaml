id: batterie-vampir
number: 6
status: published
slug: { de: batterie-vampir, en: joule-thief }

title:
  de: Batterie-Vampir
  en: Joule Thief

tagline:
  de: Saugt die letzte Energie aus „leeren“ Batterien – und lässt damit eine weiße LED leuchten.
  en: Sucks the last energy out of "empty" batteries – and uses it to light a white LED.

facts:
  age: 10
  difficulty: 2
  minutes: 100
  cost_eur: 5
  topics: [energy, light]

learn:
  de:
    - Eine Spule selbst wickeln
    - Wie eine Spule Energie speichert und als Spannungsstoß abgibt
    - Warum eine „leere“ Batterie gar nicht ganz leer ist
  en:
    - Winding a coil yourself
    - How a coil stores energy and releases it as a voltage kick
    - Why an "empty" battery is not really empty

hero: images/vampire.svg

intro:
  de: |
    Eine weiße LED braucht etwa **3 Volt**. Eine AA-Batterie hat neu 1,5 V – und wenn sie im Spielzeug nicht mehr geht,
    oft noch 1 V. Damit leuchtet keine LED … eigentlich.

    Der **Batterie-Vampir** trickst: Ein Transistor schaltet eine selbst gewickelte Spule zigtausendmal pro Sekunde ein und aus.
    Bei jedem Ausschalten gibt die Spule einen kleinen **Spannungsstoß** ab – hoch genug für die LED.
  en: |
    A white LED needs about **3 volts**. A new AA battery has 1.5 V – and when it no longer works in a toy, often still 1 V.
    That cannot light an LED … normally.

    The **Joule thief** cheats: a transistor switches a hand-wound coil on and off tens of thousands of times a second.
    Every time it switches off, the coil gives a small **voltage kick** – high enough for the LED.

simulation:
  circuit: circuit.txt
  try:
    de: |
      Die Batterie hat nur **1,2 V**, die weiße LED braucht 3 V – trotzdem leuchtet sie!
      **Doppelklick auf die Batterie** und stell 0,8 V ein: Leuchtet sie noch? Ab welcher Spannung gibt der Vampir auf?
      (Der Simulator rechnet hier sehr fein – er läuft deshalb in Zeitlupe.)
    en: |
      The battery only has **1.2 V** and the white LED needs 3 V – yet it lights up!
      **Double-click the battery** and set 0.8 V: does it still light? At what voltage does the thief give up?
      (The simulator calculates very finely here – so it runs in slow motion.)

