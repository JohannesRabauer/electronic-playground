hero: images/game2.svg

intro:
  de: |
    Erinnerst du dich an den **heißen Draht**? Jetzt bekommt er ein Gehirn! Der micro:bit erkennt, wann die Öse den
    Start verlässt, **zählt jede Berührung** mit einem Piepton und zeigt am Ziel deine **Zeit und deine Fehler** an.

    Du lötest eine kleine **Anschlussplatine**: Hier kommen Spieldraht, Öse, Start und Ziel dran, und vier
    Krokodilklemmen führen zum micro:bit. Hast du den ersten heißen Draht schon gebaut, kannst du sein Spielfeld weiterverwenden.
  en: |
    Remember the **buzz wire game**? Now it gets a brain! The micro:bit notices when the loop leaves the start,
    **counts every touch** with a beep and shows your **time and mistakes** at the finish.

    You solder a small **connection board**: the game wire, the loop, start and finish connect here, and four
    crocodile clips lead to the micro:bit. If you already built the first buzz wire game, you can reuse its course.

code:
  program: makecode/main.ts
  tutorial: { de: makecode/tutorial-de, en: makecode/tutorial-en }
  try:
    de: |
      Klick auf **„Run“**. Im Simulator sind die Pins die goldenen Felder unten: Klick auf **P0** (Öse am Start),
      dann ein paarmal auf **P1** (Fehler!) und zum Schluss auf **P2** (Ziel). Was zeigt der micro:bit an?
    en: |
      Click **"Run"**. In the simulator the pins are the golden pads at the bottom: click **P0** (loop at the start),
      then **P1** a few times (mistakes!) and finally **P2** (finish). What does the micro:bit show?

