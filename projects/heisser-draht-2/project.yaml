  de: Heißer Draht 2.0
  en: Buzz Wire 2.0

tagline:
  de: Der micro:bit zählt deine Fehler und stoppt die Zeit – wer schafft den Rekord?
  en: The micro:bit counts your mistakes and times your run – who sets the record?

