  <circle cx="232" cy="98" r="3" fill="#33691e"/><circle cx="244" cy="96" r="3" fill="#33691e"/>
  <path d="M232 110 q6 -5 12 0" stroke="#33691e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M352 70 c 10 14 14 22 14 28 a14 14 0 0 1 -28 0 c0 -6 4 -14 14 -28 z" fill="#4fc3f7" stroke="#0288d1" stroke-width="2"/>
  <!-- nails -->
  <rect x="300" y="150" width="6" height="40" fill="#9e9e9e"/><rect x="296" y="148" width="14" height="5" rx="2" fill="#757575"/>
  <rect x="340" y="150" width="6" height="40" fill="#9e9e9e"/><rect x="336" y="148" width="14" height="5" rx="2" fill="#757575"/>
  <!-- wires to the board -->
  <path d="M303 150 C 300 110, 420 120, 450 170" stroke="#1e88e5" stroke-width="4" fill="none"/>
  <path d="M343 150 C 350 125, 420 140, 462 172" stroke="#43a047" stroke-width="4" fill="none"/>
  <rect x="440" y="168" width="120" height="70" rx="6" fill="#d4b27a" stroke="#8d6b38" stroke-width="3"/>
  <circle cx="520" cy="200" r="18" fill="#262626"/><circle cx="520" cy="200" r="4" fill="#555"/>
  <rect x="452" y="186" width="10" height="16" rx="5" fill="#2b2b2b"/><rect x="470" y="186" width="10" height="16" rx="5" fill="#2b2b2b"/>
  <g stroke="#ff6d00" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M548 186 q8 -10 0 -20"/><path d="M556 190 q14 -16 0 -32"/>
  </g>
  <text x="560" y="150" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ff6d00" text-anchor="middle">BEEP!</text>
</svg>
