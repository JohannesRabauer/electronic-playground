<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-label="Thirsty plant alarm">
  <rect x="10" y="10" width="620" height="270" rx="22" fill="#e8f5e9"/>
  <!-- pot -->
  <path d="M180 170 h200 l-22 100 h-156 z" fill="#d1784c" stroke="#9c4f2a" stroke-width="3"/>
  <rect x="170" y="160" width="220" height="22" rx="5" fill="#e08a5c" stroke="#9c4f2a" stroke-width="3"/>
  <rect x="186" y="166" width="188" height="10" fill="#6d4c41"/>
  <!-- drooping plant -->
  <path d="M280 166 C 278 120, 270 90, 250 70" stroke="#558b2f" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M250 70 C 220 70, 205 95, 212 120 C 235 110, 248 92, 250 70 Z" fill="#7cb342"/>
  <path d="M276 118 C 300 110, 330 120, 338 148 C 314 150, 290 140, 276 118 Z" fill="#8bc34a"/>
  <path d="M272 100 C 250 104, 232 124, 230 150 C 252 142, 268 124, 272 100 Z" fill="#9ccc65"/>
