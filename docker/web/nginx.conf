server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Content changes while we tinker - always revalidate pages and circuits.
    location ~ \.(html|txt)$ {
        add_header Cache-Control "no-cache";
    }
    location ~ /$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
}
