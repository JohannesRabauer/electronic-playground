    - Der Lötkolben wird über 300 °C heiß. Leg ihn immer in die Ablage und fass nur den Griff an.
    - Trag eine Schutzbrille – beim Abschneiden fliegen Drahtstücke durch die Gegend.
    - Lüfte beim Löten und atme den Rauch nicht direkt ein.
    - Wasch dir nach dem Löten die Hände.
    - Nur mit Batterien arbeiten – niemals mit Strom aus der Steckdose!
