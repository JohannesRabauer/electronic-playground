en:
  lang_name: English
  site_title: Electronics Playground
  site_tagline: Soldering projects for kids aged 8 to 14 – try them in the simulator first, then build them yourself.
  home_intro: |
    Here you will find small electronics projects to **solder yourself**. Every project has a shopping list,
    a perfboard layout, a step-by-step guide and a **simulator** where you can try the circuit first.
  parents_title: For parents
  parents_text: |
    All projects run on a 9 V battery and are safe. From about age 8, children can solder with an adult
    next to them. Every guide is also available as an **A4 printout** for the workbench.
  projects_title: Projects
  categories:
    solder:
      name: Soldering
      icon: "🔥"
      text: Classic electronics with a soldering iron – battery, parts, perfboard. No computer needed.
    microbit:
      name: micro:bit
      icon: "🧩"
      text: Programming the BBC micro:bit with blocks – no soldering at all. A great place to start.
    microbit-solder:
      name: micro:bit + soldering
      icon: "🛠️"
      text: You solder your own parts and boards and control them with the micro:bit.
  coming_soon: The first projects are coming soon.
  shop_title: Shopping list
  shop_intro: |
    Everything you need for the projects – added up for **all projects**, **per category** or **per project**.
    The search links in the tables lead to a normal search in the shop – no advertising. **We do not show prices**, because they change all the time.

    **Money-saving tip:** assortments (resistors, LEDs, capacitors, buttons) are much cheaper than single parts and last for many projects.
    For the micro:bit, the **"Go" bundle** is cheapest – the cable and battery holder are included.
