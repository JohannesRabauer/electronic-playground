  safety_general:
    - The soldering iron gets hotter than 300 °C. Always put it back in the stand and only touch the handle.
    - Wear safety glasses – bits of wire fly around when you cut them.
    - Keep the room aired and do not breathe in the smoke directly.
    - Wash your hands after soldering.
    - Only work with batteries – never with power from a wall socket!
