en:
  lang_name: English
  site_title: Electronics Playground
  site_tagline: Soldering projects for kids aged 8 to 14 – try them in the simulator first, then build them yourself.
  home_intro: |
    Here you will find small electronics projects to **solder yourself**. Every project has a shopping list,
    a perfboard layout, a step-by-step guide and a **simulator** where you can try the circuit first.
  parents_title: For parents
  parents_text: |
    All projects run on a 9 V battery and are safe. From about age 8, children can solder with an adult
    next to them. Every guide is also available as an **A4 printout** for the workbench.
