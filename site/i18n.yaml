    ## Haftung für Links

    Diese Website enthält Links zu externen Websites, auf deren Inhalte ich keinen Einfluss habe. Für die Inhalte der
    verlinkten Seiten ist stets der jeweilige Anbieter verantwortlich. Bei Bekanntwerden von Rechtsverletzungen entferne ich
    solche Links umgehend.

    ## Sicherheit

    Die Anleitungen sind für Kinder gedacht, die mit einem Erwachsenen zusammen löten. Bitte beachtet die Sicherheitshinweise
    in jedem Projekt.

    ## Simulator

    Der Schaltungs-Simulator ist [CircuitJS1](https://github.com/pfalstad/circuitjs1) von Paul Falstad und Iain Sharp (GPL).
    Die micro:bit-Programme werden mit [Microsoft MakeCode](https://makecode.microbit.org) angezeigt.
