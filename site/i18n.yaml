    Hier findest du kleine Elektronik-Projekte zum **Selberlöten**. Jedes Projekt hat eine Einkaufsliste,
    einen Plan für die Lochrasterplatine, eine Schritt-für-Schritt-Anleitung und einen **Simulator**,
    in dem du die Schaltung vorher ausprobieren kannst.
  parents_title: Für Eltern
  parents_text: |
    Alle Projekte laufen mit einer 9-V-Batterie und sind ungefährlich. Ab etwa 8 Jahren können Kinder mit
    einem Erwachsenen daneben löten. Jede Anleitung gibt es auch als **A4-Ausdruck** für die Werkbank.
  projects_title: Projekte
