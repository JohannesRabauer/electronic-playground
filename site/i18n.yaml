    microbit:
      name: micro:bit
      icon: "🧩"
      text: Programmieren mit dem BBC micro:bit und Blöcken – ganz ohne Löten. Ideal für den Einstieg.
    microbit-solder:
      name: micro:bit + Löten
      icon: "🛠️"
      text: Du lötest eigene Bauteile und Platinen und steuerst sie mit dem micro:bit.
