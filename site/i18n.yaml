  privacy_updated: "Stand: Oktober 2026"
  privacy_text: |
    ## Kurz gesagt

    Diese Website setzt **keine Cookies**, nutzt **kein Tracking** und **keine Analyse-Werkzeuge**. Es gibt keine Konten,
    keine Formulare und keine Kommentare. Schriften, Bilder und der Schaltungs-Simulator kommen direkt von dieser Website.

    ## Hosting (GitHub Pages)

    Die Website liegt bei GitHub Pages, einem Dienst der GitHub, Inc., 88 Colin P. Kelly Jr. St., San Francisco, CA 94107, USA.
    Beim Aufruf einer Seite verarbeitet GitHub technisch notwendige Daten, insbesondere deine **IP-Adresse**, Datum und Uhrzeit,
    die aufgerufene Seite und Informationen über den Browser. Das dient der sicheren und stabilen Auslieferung der Website
    (Art. 6 Abs. 1 lit. f DSGVO). GitHub kann diese Daten in den USA verarbeiten; GitHub ist nach dem EU-US Data Privacy
    Framework zertifiziert. Weitere Informationen: [GitHub-Datenschutzerklärung](https://docs.github.com/de/site-policy/privacy-policies/github-general-privacy-statement).

    ## Speicherung in deinem Browser

    Wenn du in einer Anleitung Schritte als „geschafft“ abhakst oder wählst, MakeCode immer zu laden, speichert die Website das
    im **lokalen Speicher deines Browsers** (localStorage). Diese Daten verlassen dein Gerät nicht und werden nicht an uns
    übertragen. Du kannst sie jederzeit in den Browser-Einstellungen löschen.

    <a id="makecode"></a>

    ## Microsoft MakeCode

    Auf den micro:bit-Projektseiten kann das Programm mit Microsoft MakeCode angezeigt werden (Microsoft Corporation, One Microsoft
    Way, Redmond, WA 98052, USA). Die Inhalte werden **erst geladen, wenn du auf „Programm laden“ klickst**. Dann überträgt dein
    Browser deine IP-Adresse und technische Daten an Microsoft (Art. 6 Abs. 1 lit. a DSGVO – deine Einwilligung durch den Klick).
    Microsoft ist nach dem EU-US Data Privacy Framework zertifiziert. Mit dem Button unten kannst du eine gespeicherte Einwilligung
    widerrufen. Weitere Informationen: [Microsoft-Datenschutzerklärung](https://privacy.microsoft.com/de-de/privacystatement).

    Links wie „Schritt für Schritt in MakeCode“ öffnen die MakeCode-Website; dort gilt die Datenschutzerklärung von Microsoft.

    ## Links zu Shops und Partnerlinks

    Die Einkaufslisten verlinken auf Online-Shops (z. B. Amazon, Reichelt, Pollin, AliExpress). Erst wenn du einen Link anklickst,
    werden Daten an den jeweiligen Shop übertragen; dort gelten dessen Datenschutzbestimmungen. Als **„Werbung“** gekennzeichnete
    Links sind Amazon-Partnerlinks: Sie enthalten eine Partnerkennung, damit Amazon einen Kauf dieser Website zuordnen kann.
    Amazon kann dafür auf der Amazon-Website Cookies setzen. Als Amazon-Partner verdiene ich an qualifizierten Verkäufen.

    ## Deine Rechte

    Du hast das Recht auf Auskunft, Berichtigung, Löschung und Einschränkung der Verarbeitung deiner Daten, auf
    Datenübertragbarkeit und auf Widerspruch gegen die Verarbeitung (Art. 15–21 DSGVO). Eine Einwilligung kannst du jederzeit
    widerrufen. Außerdem kannst du dich bei einer Datenschutz-Aufsichtsbehörde beschweren, zum Beispiel bei der Behörde deines
    Bundeslands. Schreib mir dafür einfach eine E-Mail.
