  privacy_text: |
    ## In short

    This website sets **no cookies** and uses **no tracking** and **no analytics**. There are no accounts, forms or comments.
    Fonts, images and the circuit simulator are served by this website itself.

    ## Hosting (GitHub Pages)

    The website is hosted on GitHub Pages, a service of GitHub, Inc., 88 Colin P. Kelly Jr. St., San Francisco, CA 94107, USA.
    When you open a page, GitHub processes technically necessary data, in particular your **IP address**, date and time,
    the page requested and information about your browser. This serves the secure and stable delivery of the website
    (Art. 6(1)(f) GDPR). GitHub may process this data in the USA; GitHub is certified under the EU-US Data Privacy Framework.
    More information: [GitHub privacy statement](https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement).

    ## Storage in your browser

    If you tick steps as "done" in a guide or choose to always load MakeCode, the website stores this in your
    **browser's local storage** (localStorage). This data never leaves your device and is not sent to us. You can delete
    it at any time in your browser settings.

    <a id="makecode"></a>

    ## Microsoft MakeCode

    On the micro:bit project pages the program can be shown with Microsoft MakeCode (Microsoft Corporation, One Microsoft Way,
    Redmond, WA 98052, USA). The content is **only loaded when you click "Load program"**. Your browser then sends your IP
    address and technical data to Microsoft (Art. 6(1)(a) GDPR – your consent by clicking). Microsoft is certified under the
    EU-US Data Privacy Framework. You can withdraw a saved consent with the button below. More information:
    [Microsoft privacy statement](https://privacy.microsoft.com/en-gb/privacystatement).

    Links such as "Step by step in MakeCode" open the MakeCode website, where Microsoft's privacy statement applies.

    ## Links to shops and partner links

    The shopping lists link to online shops (e.g. Amazon, AliExpress). Data is only sent to a shop when you click a link;
    the shop's own privacy policy applies there. Links labelled **"Ad"** are Amazon partner links: they contain a partner ID
    so that Amazon can attribute a purchase to this website. Amazon may set cookies on the Amazon website for this.
    As an Amazon Associate I earn from qualifying purchases.

    ## Your rights

    You have the right of access, rectification, erasure and restriction of processing, the right to data portability and
    the right to object (Art. 15–21 GDPR). You can withdraw consent at any time. You can also complain to a data protection
    supervisory authority. Just send me an email.
