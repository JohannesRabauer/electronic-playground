de:
  lang_name: Deutsch
  site_title: Elektronik-Spielplatz
  site_tagline: Lötprojekte für Kinder von 8 bis 14 – erst im Simulator ausprobieren, dann selbst bauen.
  home_intro: |
    Hier findest du kleine Elektronik-Projekte zum **Selberlöten**. Jedes Projekt hat eine Einkaufsliste,
    einen Plan für die Lochrasterplatine, eine Schritt-für-Schritt-Anleitung und einen **Simulator**,
    in dem du die Schaltung vorher ausprobieren kannst.
  parents_title: Für Eltern
  parents_text: |
    Alle Projekte laufen mit einer 9-V-Batterie und sind ungefährlich. Ab etwa 8 Jahren können Kinder mit
    einem Erwachsenen daneben löten. Jede Anleitung gibt es auch als **A4-Ausdruck** für die Werkbank.
  projects_title: Projekte
  categories:
    solder:
      name: Löten
      icon: "🔥"
      text: Klassische Elektronik mit Lötkolben – Batterie, Bauteile, Lochrasterplatine. Kein Computer nötig.
    microbit:
      name: micro:bit
      icon: "🧩"
      text: Programmieren mit dem BBC micro:bit und Blöcken – ganz ohne Löten. Ideal für den Einstieg.
    microbit-solder:
      name: micro:bit + Löten
      icon: "🛠️"
      text: Du lötest eigene Bauteile und Platinen und steuerst sie mit dem micro:bit.
  coming_soon: Hier kommen bald die ersten Projekte.
  shop_title: Einkaufsliste
  shop_intro: |
    Alles, was du für die Projekte brauchst – zusammengezählt für **alle Projekte**, **je Kategorie** oder **je Projekt**.
    Die Links führen zu einer ganz normalen Suche im Shop: **keine Werbe- oder Affiliate-Links** und **keine Preise**, weil die sich ständig ändern.

    **Spartipp:** Sortimente (Widerstände, LEDs, Kondensatoren, Taster) sind viel günstiger als Einzelteile und reichen für viele Projekte.
    Für den micro:bit ist das **„Go“-Set** am günstigsten – Kabel und Batteriehalter sind dabei.
